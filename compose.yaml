services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  db-provision:
    profiles: ["provision"]
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_BOOTSTRAP_ON_START: "false"
    command: ["node", "server/tools/provision.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  db-transfer:
    profiles: ["transfer"]
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_BOOTSTRAP_ON_START: "false"
    command: ["node", "server/tools/transfer-sqlite-to-postgres.js", "--source", "/migration/database.sqlite"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SQLITE_SOURCE_DIR:-./migration}:/migration:ro
    restart: "no"
    networks:
      - internal

  db-validate:
    profiles: ["transfer"]
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_BOOTSTRAP_ON_START: "false"
    command: ["node", "server/tools/validate-postgres-transfer.js", "--source", "/migration/database.sqlite"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SQLITE_SOURCE_DIR:-./migration}:/migration:ro
    restart: "no"
    networks:
      - internal

  uploads-restore:
    profiles: ["uploads"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/tools/restore-uploads.js", "--source", "/migration/uploads"]
    volumes:
      - ${UPLOADS_SOURCE_DIR:-./migration}:/migration:ro
      - uploads_data:/app/uploads
    user: root
    restart: "no"
    networks:
      - internal

  uploads-validate:
    profiles: ["uploads"]
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_BOOTSTRAP_ON_START: "false"
    command: ["node", "server/tools/validate-uploads.js"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads:ro
    restart: "no"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # RDB snapshots (900s/1key, 300s/10keys, 60s/10000keys) + AOF for durability.
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_BOOTSTRAP_ON_START: "false"
      HTTPS_ENABLED: "false"
      HTTPS_REDIRECT: "false"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      LOG_DIR: /app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  # Second API replica for scaling verification (profile: scale).
  # Shares Redis (rate-limit, cache, Socket.IO) and PostgreSQL.
  api-2:
    profiles: ["scale"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_BOOTSTRAP_ON_START: "false"
      HTTPS_ENABLED: "false"
      HTTPS_REDIRECT: "false"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      LOG_DIR: /app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-SaaS}
        VITE_LIFF_ORG_ID: ${VITE_LIFF_ORG_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Monitoring stack ──────────────────────────────────────────────────────

  # Alert relay — forwards Uptime Kuma webhooks to LINE Notify.
  # Standalone container: zero API/NPM deps, survives API crashes.
  alert-relay:
    build:
      context: .
      dockerfile: Dockerfile.alert-relay
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN}
    networks:
      - internal

  # Uptime Kuma — health-check dashboard. Access via 127.0.0.1:3001.
  # Manual setup: add monitor → http://api:3000/api/health (60 s interval),
  # add notification → Webhook → http://alert-relay:3003/notify.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:${UK_PORT:-3001}:3001"
    networks:
      - internal

  # Loki — log aggregation (opt-in: compose --profile monitoring up -d).
  # Receives structured JSON logs from the API via winston-loki transport.
  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal

  # Grafana — observability dashboards (opt-in: compose --profile monitoring up -d).
  # Loki datasource is auto-provisioned. Access via 127.0.0.1:3002.
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:${GF_PORT:-3002}:3000"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  logs_data:
  redis_data:
  uptime_kuma_data:
  loki_data:
  grafana_data:
