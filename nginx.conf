# Upstream group for the API. ip_hash keeps a client pinned to the same
# replica across Socket.IO reconnects (sticky session). For a single
# replica it is a no-op; with multiple replicas, add more `server` lines.
upstream api_backend {
  ip_hash;
  server api:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # AI agent turns run a multi-iteration tool loop (up to 5 provider
    # round-trips, each allowed 120s) — nginx's 60s default cuts the request
    # before the backend answers, surfacing as a 504 with no app log line.
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
  }

  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Prevent large file uploads/downloads from hitting nginx's 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
