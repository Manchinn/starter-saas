# Upstream group for the API. ip_hash keeps a client pinned to the same
# replica across Socket.IO reconnects (sticky session). For a single
# replica it is a no-op; with multiple replicas, add more `server` lines.
upstream api_backend {
  ip_hash;
  server api:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # AI agent turns run a multi-iteration tool loop (up to 5 provider
    # round-trips, each allowed 120s) — nginx's 60s default cuts the request
    # before the backend answers, surfacing as a 504 with no app log line.
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
  }

  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Prevent large file uploads/downloads from hitting nginx's 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    # Security headers for the SPA document only. Proxied paths (/api/, /uploads/,
    # /socket.io/) get their own headers from Express (server/app.js) — a
    # server-level add_header here would duplicate/conflict with those (e.g.
    # Referrer-Policy no-referrer vs strict-origin-when-cross-origin). CSP ships
    # Report-Only first: the Vite SPA uses inline script/style, so enforce only
    # after the browser console shows no real violations. http→https redirection
    # is a Cloudflare-edge concern (Always Use HTTPS) — nginx sits behind the
    # tunnel.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.line.me wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    try_files $uri $uri/ /index.html;
  }
}
