name: CI - Test & Build

# Runs on every push and pull request to main.
# - test:  122 suites / 1522 unit tests (jest, mocks models — no DB needed)
# - build: Vite production bundle (client SPA)
#
# Uses npm install (not ci) because the lockfile is generated on Windows
# and lacks Linux-native optional dependencies (@rollup/rollup-linux-x64-gnu).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # npm ci can't install platform-native optional deps for Linux
        # when lockfile was generated on Windows. Remove lockfile so npm
        # re-resolves optional deps for the runner platform.
        run: |
          rm -f package-lock.json
          npm install

      - name: Run unit tests
        run: npx jest --config server/jest.config.js

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: test-results/unit-tests.html

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build client (Vite)
        run: npm run build
