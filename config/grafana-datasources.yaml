# ── Grafana datasource provisioning ────────────────────────────────────────────
# Auto-configures the Loki datasource on first Grafana launch.
# Edit at runtime: http://127.0.0.1:3002 → Connections → Data sources

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
